<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Gestion du budget</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--ac:#16b378;--ac-bg:#e8f7f1;--ac-dk:#0f7a52;--bd:#e3e3e3;--bg2:#f7f7f8;--tx:#262633;--tx2:#6b6b78;--red:#d64545;--red-bg:#fdecec;--amb:#b7791f;--amb-bg:#fdf4e3;--blue:#3b82c4;--blue-bg:#e8f1fb;--inv:#2f7d32;--inv-bg:#e6f4e6;--fon:#8a5a00;--fon-bg:#fdf1d8}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px;color:var(--tx);background:#fff}
header{display:flex;align-items:center;gap:10px;padding:12px 16px 0;flex-wrap:wrap}
header h1{font-size:16px;font-weight:600;margin:0;flex:1;min-width:200px}
nav{display:flex;gap:2px;border-bottom:1px solid var(--bd);padding:0 16px;margin-top:10px}
nav button{background:none;border:none;border-bottom:2px solid transparent;padding:9px 12px;font-size:13px;color:var(--tx2);cursor:pointer}
nav button.on{color:var(--tx);border-bottom-color:var(--ac);font-weight:600}
main{padding:14px 16px 40px}
select,input,textarea{font:inherit;font-size:13px;height:30px;padding:0 8px;border:1px solid var(--bd);border-radius:6px;background:#fff;color:var(--tx)}
textarea{height:54px;padding:6px 8px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}
button.b{font:inherit;height:30px;padding:0 12px;border:1px solid var(--bd);border-radius:6px;background:#fff;cursor:pointer;color:var(--tx)}
button.b:hover{background:var(--bg2)}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button.p:hover{background:var(--ac-dk)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--bg2);border-radius:8px;padding:10px 14px}
.card .l{font-size:12px;color:var(--tx2)}.card .v{font-size:20px;font-weight:600;margin-top:2px}
.box{border:1px solid var(--bd);border-radius:10px;overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
th{font-size:12px;font-weight:500;color:var(--tx2);background:var(--bg2);position:sticky;top:0;white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--bg2)}
tr.sel{background:var(--ac-bg)!important}
.r{text-align:right;white-space:nowrap}
.sub{font-size:12px;color:var(--tx2)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.inv{background:var(--inv-bg);color:var(--inv)}.fon{background:var(--fon-bg);color:var(--fon)}
.neg{color:var(--red)}.pos{color:var(--inv)}.mut{color:#aaa}
.bar{height:9px;background:#eee;border-radius:5px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.yr{display:grid;grid-template-columns:52px 1fr 230px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.form{border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:14px;background:#fff}
.form h3{margin:0 0 10px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.f label{display:block;font-size:12px;color:var(--tx2);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%}
.f.w2{grid-column:span 2}
.acts{display:flex;gap:8px;align-items:center;margin-top:12px}
.err{color:var(--red);font-size:12.5px}
.warn{background:var(--amb-bg);color:var(--amb);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:12.5px}
.alert{background:var(--red-bg);color:var(--red);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:12.5px}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.sp{flex:1}
h2{font-size:14px;font-weight:600;margin:18px 0 8px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#262633;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
.empty{padding:16px;color:var(--tx2);text-align:center}
.legend{display:flex;gap:14px;font-size:12px;color:var(--tx2);margin-bottom:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
</style>
</head>
<body>
<header>
  <img id="logo" alt="SDIS de l'Ain" style="height:34px">
  <h1 id="titre">Gestion du budget</h1>
  <label class="sub" for="fAxe">Axe</label>
  <select id="fAxe"><option value="">Tous</option></select>
  <button class="b" id="btnRefresh" title="Recharger les données">↻</button>
</header>
<nav id="tabs"></nav>
<main id="view"><div class="empty">Chargement…</div></main>
<div id="toast"></div>

async function loadMeta() {
  const tb = await grist.docApi.fetchTable('_grist_Tables');
  const cl = await grist.docApi.fetchTable('_grist_Tables_column');
  const tables = {}; tb.id.forEach((id, i) => tables[id] = tb.tableId[i]);
  const byRowId = {}; const cols = {};
  cl.id.forEach((id, i) => {
    const t = tables[cl.parentId[i]]; if (!t) return;
    let wo = {}; try { wo = JSON.parse(cl.widgetOptions[i] || '{}'); } catch (e) {}
    const c = { id, table: t, colId: cl.colId[i], type: cl.type[i], isFormula: cl.isFormula[i],
                formula: cl.formula[i], visibleCol: cl.visibleCol[i], choices: wo.choices || [], label: cl.label[i] };
    byRowId[id] = c; (cols[t] = cols[t] || {})[c.colId] = c;
  });
  S.meta = { tables: Object.values(tables), cols, byRowId };
}
const col = (t, c) => S.meta.cols[t] && S.meta.cols[t][c];
const hasT = t => S.meta.tables.includes(t);
const refTarget = (t, c) => { const m = col(t, c); return m && /^Ref:/.test(m.type) ? m.type.slice(4) : null; };
const writable = (t, c) => { const m = col(t, c); return m && !(m.isFormula && m.formula); };

function toRows(d) { const keys = Object.keys(d); return (d.id || []).map((_, i) => { const r = {}; keys.forEach(k => r[k] = d[k][i]); return r; }); }

async function refLabels(t, c) {
  const target = refTarget(t, c); if (!target) return null;
  const key = target + '|' + (col(t, c).visibleCol || 0);
  if (S.refCache[key]) return S.refCache[key];
  const vc = S.meta.byRowId[col(t, c).visibleCol];
  const d = toRows(await grist.docApi.fetchTable(target));
  const map = {};
  d.forEach(r => { let v = vc ? r[vc.colId] : r.id; map[r.id] = v == null ? '' : String(Array.isArray(v) ? v.slice(1).join(', ') : v); });
  return (S.refCache[key] = map);
}
function disp(t, c, v) {
  const target = refTarget(t, c);
  if (target) { const key = target + '|' + (col(t, c).visibleCol || 0); return (S.refCache[key] || {})[v] ?? (v ? '#' + v : ''); }
  if (Array.isArray(v)) return v.slice(1).join(', ');
  return v == null ? '' : String(v);
}

/* ---------- Chargement ---------- */
async function load() {
  try {
    if (!S.meta) await loadMeta();
    S.refCache = {}; S.missing = [];
    for (const [t, cfg] of [[B.table, B], [C.table, C], [R.table, R]]) {
      if (!hasT(t)) { S.missing.push(`Table « ${t} » introuvable`); continue; }
      for (const k of Object.keys(cfg)) if (k !== 'table' && !col(t, cfg[k])) cfg === B && ['libelle','groupement'].includes(k) || S.missing.push(`${t}.${cfg[k]}`);
    }
    if (!hasT(B.table)) { render(); return; }
    S.data.B = toRows(await grist.docApi.fetchTable(B.table));
    S.data.C = hasT(C.table) ? toRows(await grist.docApi.fetchTable(C.table)) : [];
    S.data.R = hasT(R.table) ? toRows(await grist.docApi.fetchTable(R.table)) : [];
    const refs = [[B.table, B.axe], [B.table, B.service], [B.table, B.groupement],
      [C.table, C.presta], [C.table, C.resp], [C.table, C.meo], [C.table, C.ligne]];
    for (const [t, c] of refs) if (col(t, c)) await refLabels(t, c);
    fillAxe(); render();
  } catch (e) { $('view').innerHTML = `<div class="alert">Erreur de chargement : ${esc(e.message || e)}<br>Vérifiez que le widget a l'accès complet au document.</div>`; }
}

/* ---------- Accès aux lignes de budget ---------- */
const L = id => S.data.B.find(r => r.id === id);
const yearOf = r => String(r[B.annee] ?? '');
const lineLabel = r => {
  if (col(B.table, B.libelle) && r[B.libelle]) return String(r[B.libelle]);
  return [yearOf(r), disp(B.table, B.axe, r[B.axe]), r[B.ref], r[B.com]].filter(Boolean).join(' · ');
};
const prevu = r => num(r[B.montant]);
const conso = r => num(r[B.consomme]);
const dispo = r => col(B.table, B.dispo) ? num(r[B.dispo]) : prevu(r) + repIn(r.id) - repOut(r.id);
const reste = r => col(B.table, B.reste) ? num(r[B.reste]) : dispo(r) - conso(r);
const repIn = id => S.data.R.filter(x => x[R.cible] === id).reduce((a, x) => a + num(x[R.montant]), 0);
const repOut = id => S.data.R.filter(x => x[R.source] === id).reduce((a, x) => a + num(x[R.montant]), 0);
const isInv = r => /^inv/i.test(String(r[B.section] || ''));
const lines = () => S.data.B.filter(r => !S.axe || String(r[B.axe]) === S.axe);
function years() {
  const s = new Set((col(B.table, B.annee)?.choices || []).map(String));
  S.data.B.forEach(r => yearOf(r) && s.add(yearOf(r)));
  return [...s].sort();
}
function fillAxe() {
  const sel = $('fAxe'), ids = [...new Set(S.data.B.map(r => r[B.axe]).filter(Boolean))];
  const opts = ids.map(id => [String(id), disp(B.table, B.axe, id)]).sort((a, b) => a[1].localeCompare(b[1]));
  sel.innerHTML = '<option value="">Tous</option>' + opts.map(([v, l]) => `<option value="${esc(v)}" ${v === S.axe ? 'selected' : ''}>${esc(l)}</option>`).join('');
}
const sectionPill = v => v ? `<span class="pill ${/^inv/i.test(v) ? 'inv' : 'fon'}">${esc(v)}</span>` : '';

/* ---------- Champs de formulaire génériques ---------- */
function field(t, c, v, label, cls = '', opts = {}) {
  const m = col(t, c); if (!m) return '';
  const id = `in_${t}_${c}`; let h;
  if (/^Ref:/.test(m.type)) {
    const map = S.refCache[m.type.slice(4) + '|' + (m.visibleCol || 0)] || {};
    const opts = Object.entries(map).sort((a, b) => a[1].localeCompare(b[1]));
    h = `<select id="${id}"><option value="0"></option>${opts.map(([k, l]) => `<option value="${k}" ${+k === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  } else if (m.type === 'Choice') {
    const ch = m.choices.map(String); if (v && !ch.includes(String(v))) ch.push(String(v));
    h = `<select id="${id}"><option value=""></option>${ch.map(o => `<option ${o === String(v ?? '') ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  } else if (m.type === 'Date') h = `<input type="date" id="${id}" value="${isoDate(v)}">`;
  else if (/^(Numeric|Int)$/.test(m.type)) h = `<input type="number" step="0.01" id="${id}" value="${v ?? ''}">`;
  else if (c === B.com || c === C.com) h = `<textarea id="${id}">${esc(v ?? '')}</textarea>`;
  else h = `<input type="text" id="${id}" value="${esc(v ?? '')}">`;
  if (opts.add && /^Ref:/.test(m.type)) h = `<div style="display:flex;gap:6px">${h.replace('<select ', '<select style="flex:1" ')}<button type="button" class="b" data-add="${t}|${c}" title="Ajouter un ${esc(opts.add)}">+</button></div>
    <div id="add_${id}" hidden style="margin-top:6px;padding:8px;border:1px dashed var(--bd);border-radius:6px;background:var(--bg2)">
      <input type="text" placeholder="Nom du nouveau ${esc(opts.add)}" style="width:100%;margin-bottom:6px">
      <div style="display:flex;gap:6px;align-items:center"><button type="button" class="b p ok">Ajouter</button><button type="button" class="b ko">Annuler</button><span class="err"></span></div></div>`;
  return `<div class="f ${cls}"><label for="${id}">${esc(label || m.label || c)}</label>${h}</div>`;
}
function readField(t, c) {
  const m = col(t, c), el = $(`in_${t}_${c}`); if (!m || !el) return undefined;
  const v = el.value;
  if (/^Ref:/.test(m.type)) return +v || 0;
  if (m.type === 'Date') { if (!v) return null; const [y, mo, d] = v.split('-').map(Number); return Date.UTC(y, mo - 1, d) / 1000; }
  if (m.type === 'Int') return v === '' ? null : parseInt(v, 10);
  if (m.type === 'Numeric') return v === '' ? null : parseFloat(v);
  return v;
}
function typed(t, c, v) { const m = col(t, c); if (!m) return v; return m.type === 'Int' || m.type === 'Numeric' ? Number(v) : String(v); }

/* ---------- Onglets ---------- */

/* ---------- 1. Synthèse ---------- */
function vSynthese() {
  const ls = lines();
  const P = ls.reduce((a, r) => a + prevu(r), 0), Co = ls.reduce((a, r) => a + conso(r), 0), Re = ls.reduce((a, r) => a + reste(r), 0);
  const ids = new Set(ls.map(r => r.id)); const Rp = S.data.R.filter(x => ids.has(x[R.source])).reduce((a, x) => a + num(x[R.montant]), 0);
  const cur = String(new Date().getFullYear());
  const yrs = [...new Set(ls.map(yearOf))].filter(Boolean).sort();
  const yrHtml = yrs.map(y => {
    const g = ls.filter(r => yearOf(r) === y), d = g.reduce((a, r) => a + dispo(r), 0), c = g.reduce((a, r) => a + conso(r), 0);
    const inv = g.filter(isInv).reduce((a, r) => a + dispo(r), 0), pc = d > 0 ? Math.min(100, c / d * 100) : 0;
    return `<div class="yr"><b>${esc(y)}</b><div class="bar"><i style="width:${pc}%;background:var(--ac)"></i><i style="width:${100 - pc}%;background:#b9d6f2"></i></div>
      <div class="r sub">${eur(c)} / ${eur(d)} · ${Math.round(pc)} %<br>Inv. ${eur(inv)} · Fonct. ${eur(d - inv)}</div></div>`;
  }).join('');
  const axes = {}; ls.forEach(r => { const k = disp(B.table, B.axe, r[B.axe]) || '—'; const a = axes[k] = axes[k] || [0, 0, 0, 0]; a[0] += prevu(r); a[1] += dispo(r); a[2] += conso(r); a[3] += reste(r); });
  const late = ls.filter(r => yearOf(r) < cur && reste(r) > 0.5), over = ls.filter(r => reste(r) < -0.5);
  return `<div class="cards">
    <div class="card"><div class="l">Prévu initial</div><div class="v">${eur(P)}</div></div>
    <div class="card"><div class="l">Montants reportés</div><div class="v">${eur(Rp)}</div></div>
    <div class="card"><div class="l">Consommé</div><div class="v">${eur(Co)}</div></div>
    <div class="card"><div class="l">Reste à consommer</div><div class="v" style="color:var(--ac-dk)">${eur(Re)}</div></div></div>
    ${over.length ? `<div class="alert">⚠ ${over.length} ligne(s) en dépassement : ${over.map(r => esc(lineLabel(r)) + ' (' + eur(reste(r)) + ')').join(' ; ')}</div>` : ''}
    ${late.length ? `<div class="warn">${late.length} ligne(s) d'exercices passés ont encore un reste à consommer (${eur(late.reduce((a, r) => a + reste(r), 0))}). Pensez à les reporter. <button class="b" id="goRep">Aller aux reports</button></div>` : ''}
    <h2>Par année</h2><div class="legend"><span style="--c:var(--ac)">Consommé</span><span style="--c:#b9d6f2">Reste</span></div>
    ${yrHtml || '<div class="empty">Aucune ligne</div>'}
    <h2>Par axe</h2><div class="box"><table><thead><tr><th>Axe</th><th class="r">Prévu</th><th class="r">Disponible</th><th class="r">Consommé</th><th class="r">Reste</th></tr></thead><tbody>
    ${Object.entries(axes).sort().map(([k, a]) => `<tr><td>${esc(k)}</td><td class="r">${eur(a[0])}</td><td class="r">${eur(a[1])}</td><td class="r">${eur(a[2])}</td><td class="r ${a[3] < 0 ? 'neg' : ''}"><b>${eur(a[3])}</b></td></tr>`).join('')}
    </tbody></table></div>`;
}
function bSynthese() { const g = $('goRep'); if (g) g.onclick = () => { S.tab = 3; render(); }; }

/* ---------- 2. Lignes budgétaires ----------
   S.lMode : null = liste | 'detail' = fiche en lecture | 'edit' = formulaire
             'confirm' = récapitulatif avant enregistrement | 'new' = création */
const LINE_FIELDS = () => [B.annee, B.axe, B.ref, B.section, B.service, B.montant, B.com].filter(c => writable(B.table, c));

  [B.service]: 'Service', [B.montant]: 'Montant prévu', [B.com]: 'Commentaire' });
const showVal = (c, v) => c === B.montant ? eur(v) : (disp(B.table, c, v) || '—');

  if (S.lMode && S.lMode !== 'new' && !L(S.editLine)) S.lMode = null;

  ${ls.map(r => { const rp = dispo(r) - prevu(r); return `<tr class="click" data-id="${r.id}">
    <td>${esc(yearOf(r))}</td><td>${esc(disp(B.table, B.axe, r[B.axe]))} · ${esc(r[B.ref])}<div class="sub">${esc(r[B.com])}</div></td>

  </tbody><tfoot><tr><th colspan="3">Total</th><th class="r">${eur(tot(prevu))}</th><th></th><th class="r">${eur(tot(dispo))}</th><th class="r">${eur(tot(conso))}</th><th class="r">${eur(tot(reste))}</th></tr></tfoot></table></div>`;
}

function vDetail() {
  const r = L(S.editLine);
  const cmds = S.data.C.filter(c => c[C.ligne] === r.id).sort((a, b) => num(b[C.date]) - num(a[C.date]));
  const reps = S.data.R.filter(x => x[R.source] === r.id || x[R.cible] === r.id).sort((a, b) => num(b[R.date]) - num(a[R.date]) || b.id - a.id);

function formLigne(r) {

function diffLine(r) {
  return LINE_FIELDS().filter(c => S.pending && c in S.pending && String(S.pending[c] ?? '') !== String(r[c] ?? ''));
}
function vConfirm(r, cmds, reps) {
  const ch = diffLine(r), L_ = FIELD_LABELS();
  const warns = [];
  if (ch.includes(B.montant)) {
    const nr = reste(r) + num(S.pending[B.montant]) - prevu(r);
    if (nr < 0) warns.push(`Avec ce montant, le reste à consommer deviendrait négatif (${eur(nr)}).`);
  }
  if (ch.includes(B.annee) && (cmds.length || reps.length))
    warns.push(`Cette ligne a ${cmds.length} commande(s) et ${reps.length} report(s). Changer son année fera sortir du calcul les commandes saisies sur l'ancienne année.`);

function readLine() {

}
function checkLine(f) {
  if (!f[B.annee]) return 'Indiquez l\'année';

function bLignes() {

    };

  if (S.lMode === 'detail') { $('dEdit').onclick = () => { S.lMode = 'edit'; S.pending = null; render(); }; return; }
  if (S.lMode === 'edit') {
    $('lCancel').onclick = () => { S.lMode = 'detail'; S.pending = null; render(); };

      const f = readLine(), e = $('lErr'), m = checkLine(f); if (m) return e.textContent = m;

    };
    return;
  }
  if (S.lMode === 'confirm') {
    $('cfBack').onclick = () => { S.lMode = 'edit'; render(); };
    $('cfCancel').onclick = () => { S.lMode = 'detail'; S.pending = null; render(); };

        S.lMode = 'detail'; S.pending = null; toast('Ligne modifiée'); await load(); }
      catch (er) { $('cfErr').textContent = 'Erreur : ' + er.message; }

}

/* ---------- Ajout d'une valeur dans une table de référence (ex. prestataire) ---------- */
async function addRefValue(t, c, name) {
  const m = col(t, c), target = m.type.slice(4), vc = S.meta.byRowId[m.visibleCol];
  if (!vc) throw new Error('La colonne n\'affiche aucun champ : réglez « Afficher la colonne » dans Grist');
  if (vc.isFormula && vc.formula) throw new Error(`Le champ affiché (${vc.colId}) est une formule : ajout impossible depuis le widget`);
  const key = target + '|' + m.visibleCol, map = S.refCache[key] = S.refCache[key] || {};
  const n = name.trim(), found = Object.entries(map).find(([, l]) => l.trim().toLowerCase() === n.toLowerCase());
  if (found) return { id: +found[0], existed: true };
  const res = await grist.docApi.applyUserActions([['AddRecord', target, null, { [vc.colId]: n }]]);
  map[res.retValues[0]] = n; return { id: res.retValues[0], existed: false };
}
function bindAdds() {
  document.querySelectorAll('[data-add]').forEach(btn => {
    const [t, c] = btn.dataset.add.split('|'), id = `in_${t}_${c}`, box = $('add_' + id);
    const inp = box.querySelector('input'), err = box.querySelector('.err');
    btn.onclick = () => { box.hidden = !box.hidden; if (!box.hidden) { inp.value = ''; err.textContent = ''; inp.focus(); } };
    box.querySelector('.ko').onclick = () => { box.hidden = true; };
    const go = async () => {
      if (!inp.value.trim()) return err.textContent = 'Saisissez un nom';
      try {
        const r = await addRefValue(t, c, inp.value), sel = $(id);
        if (![...sel.options].some(o => +o.value === r.id)) sel.add(new Option(inp.value.trim(), r.id));
        sel.value = String(r.id); box.hidden = true;
        toast(r.existed ? 'Déjà existant : sélectionné' : 'Ajouté et sélectionné');
      } catch (er) { err.textContent = er.message; }
    };
    box.querySelector('.ok').onclick = go;
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); go(); } };
  });
}

/* ---------- 5. Rapport PDF ---------- */
const RUBRIQUES = [['cles', 'Chiffres clés'], ['section', 'Exécution par section'], ['axe', 'Exécution par axe et référence'],
  ['pluri', 'Évolution pluriannuelle'], ['alertes', 'Points d\'attention'], ['cmd', 'Commandes de la période'],
  ['rep', 'Journal des reports'], ['annexe', 'Annexe : détail des lignes']];
S.rp = { yr: '', arr: new Date().toISOString().slice(0, 10), seuil: 50,
  rub: { cles: true, section: true, axe: true, pluri: true, alertes: true, cmd: true, rep: true, annexe: false } };

function rpCalc() {
  let arr = Infinity;
  if (S.rp.arr) { const [y, m, d] = S.rp.arr.split('-').map(Number); arr = Date.UTC(y, m - 1, d) / 1000; }
  const inDate = v => !v || num(v) <= arr;
  const C_ = S.data.C.filter(c => inDate(c[C.date])), R_ = S.data.R.filter(x => inDate(x[R.date]));
  const st = r => {
    const rin = R_.filter(x => x[R.cible] === r.id).reduce((a, x) => a + num(x[R.montant]), 0);
    const rout = R_.filter(x => x[R.source] === r.id).reduce((a, x) => a + num(x[R.montant]), 0);
    const eng = C_.filter(c => c[C.ligne] === r.id && String(c[C.annee]) === yearOf(r)).reduce((a, c) => a + num(c[C.montant]), 0);
    const d = prevu(r) + rin - rout; return { r, p: prevu(r), rin, rout, d, eng, rest: d - eng };
  };
  const all = lines().map(st), sel = all.filter(x => !S.rp.yr || yearOf(x.r) === S.rp.yr);
  const ids = new Set(sel.map(x => x.r.id));
  return { arr, all, sel, ids,
    cmds: C_.filter(c => ids.has(c[C.ligne])).sort((a, b) => num(a[C.date]) - num(b[C.date])),
    reps: R_.filter(x => ids.has(x[R.source]) || ids.has(x[R.cible])).sort((a, b) => num(a[R.date]) - num(b[R.date])) };
}
const agg = xs => xs.reduce((a, x) => ({ p: a.p + x.p, rin: a.rin + x.rin, rout: a.rout + x.rout, d: a.d + x.d, eng: a.eng + x.eng, rest: a.rest + x.rest }),
  { p: 0, rin: 0, rout: 0, d: 0, eng: 0, rest: 0 });
const tauxN = a => a.d > 0 ? a.eng / a.d * 100 : null;
const tauxS = a => { const t = tauxN(a); return t == null ? '-' : Math.round(t) + ' %'; };

function vRapport() {
  const k = rpCalc(), a = agg(k.sel);
  return `<div class="form"><h3>Paramètres du rapport</h3><div class="grid">
    <div class="f"><label for="rpYr">Exercice</label><select id="rpYr"><option value="">Tous les exercices</option>${years().map(y => `<option ${y === S.rp.yr ? 'selected' : ''}>${esc(y)}</option>`).join('')}</select></div>
    <div class="f"><label for="rpArr">Date d'arrêté</label><input type="date" id="rpArr" value="${S.rp.arr}"></div>
    <div class="f"><label for="rpSeuil">Seuil de sous-consommation (%)</label><input type="number" id="rpSeuil" min="0" max="100" step="1" value="${S.rp.seuil}"></div>
    <div class="f"><label>Axe</label><div style="padding-top:6px">${S.axe ? esc(disp(B.table, B.axe, +S.axe)) : 'Tous (filtre en haut du widget)'}</div></div></div>
    <div class="f" style="margin-top:12px"><label>Rubriques à inclure</label>
    <div style="display:flex;flex-wrap:wrap;gap:6px 18px">${RUBRIQUES.map(([key, l]) => `<label style="display:flex;gap:6px;align-items:center;font-size:13px;color:var(--tx)"><input type="checkbox" class="rpRub" data-k="${key}" ${S.rp.rub[key] ? 'checked' : ''} style="height:auto">${l}</label>`).join('')}</div></div>
    <div class="acts"><button class="b p" id="rpGo">Générer le PDF</button><span class="err" id="rpErr"></span></div></div>
  <div class="sub" style="margin-bottom:8px">Aperçu des chiffres au ${S.rp.arr ? new Date(S.rp.arr).toLocaleDateString('fr-FR', { timeZone: 'UTC' }) : '—'} · ${k.sel.length} ligne(s), ${k.cmds.length} commande(s), ${k.reps.length} report(s)</div>
  <div class="cards">
    <div class="card"><div class="l">Prévu initial</div><div class="v">${eur(a.p)}</div></div>
    <div class="card"><div class="l">Disponible</div><div class="v">${eur(a.d)}</div></div>
    <div class="card"><div class="l">Engagé</div><div class="v">${eur(a.eng)}</div></div>
    <div class="card"><div class="l">Reste</div><div class="v">${eur(a.rest)}</div></div>
    <div class="card"><div class="l">Taux d'exécution</div><div class="v">${tauxS(a)}</div></div></div>`;
}
function bRapport() {
  $('rpYr').onchange = e => { S.rp.yr = e.target.value; render(); };
  $('rpArr').onchange = e => { S.rp.arr = e.target.value; render(); };
  $('rpSeuil').onchange = e => { S.rp.seuil = Math.max(0, Math.min(100, +e.target.value || 0)); };
  document.querySelectorAll('.rpRub').forEach(cb => cb.onchange = () => { S.rp.rub[cb.dataset.k] = cb.checked; });
  $('rpGo').onclick = () => {
    if (!Object.values(S.rp.rub).some(Boolean)) return $('rpErr').textContent = 'Cochez au moins une rubrique';
    if (!window.jspdf) return $('rpErr').textContent = 'Bibliothèque PDF non chargée (accès à cdnjs.cloudflare.com bloqué ?)';
    try { buildPdf(); } catch (er) { $('rpErr').textContent = 'Erreur : ' + er.message; console.error(er); }
  };
}

/* Texte compatible avec les polices standard du PDF */
const pt = s => String(s ?? '').replace(/[   ]/g, ' ').replace(/→/g, '->').replace(/[−–]/g, '-').replace(/⚠/g, '!')
  .replace(/[^\x00-\xff€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•—˜™š›œžŸ]/g, '');
const pe = v => pt(Math.round(num(v)).toLocaleString('fr-FR')) + ' €';
const ps = v => (v > 0 ? '+' : v < 0 ? '-' : '') + (v ? pe(Math.abs(v)) : '-');

function buildPdf() {
  const { jsPDF } = window.jspdf, k = rpCalc(), a = agg(k.sel), rub = S.rp.rub;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  const W = 297, M = 14, HEAD = [52, 73, 94], ACC = [22, 179, 120], RED = [192, 80, 77], AMB = [183, 121, 31];
  const arrTxt = S.rp.arr ? new Date(S.rp.arr).toLocaleDateString('fr-FR', { timeZone: 'UTC' }) : '-';
  const perim = [S.rp.yr ? 'Exercice ' + S.rp.yr : 'Tous exercices', S.axe ? 'Axe ' + disp(B.table, B.axe, +S.axe) : 'Tous axes', 'Arrêté au ' + arrTxt].join('  ·  ');
  let y = 0;
  const TBL = { theme: 'grid', margin: { left: M, right: M, top: 22, bottom: 16 },
    styles: { font: 'helvetica', fontSize: 8.5, cellPadding: 1.8, lineColor: [225, 225, 225], lineWidth: 0.2, textColor: [40, 40, 50] },
    headStyles: { fillColor: HEAD, textColor: 255, fontStyle: 'bold' }, footStyles: { fillColor: [236, 239, 242], textColor: [30, 30, 40], fontStyle: 'bold' } };
  const num6 = { halign: 'right' };
  const title = t => { if (y > 170) { doc.addPage(); y = 24; } doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5); doc.setTextColor(...HEAD); doc.text(pt(t), M, y); doc.setDrawColor(...ACC); doc.setLineWidth(0.6); doc.line(M, y + 1.6, M + 22, y + 1.6); y += 5; };
  const table = o => { const cs = o.columnStyles || {}, user = o.didParseCell;
    o.didParseCell = d => { if (d.section !== 'body' && cs[d.column.index] && cs[d.column.index].halign === 'right') d.cell.styles.halign = 'right'; if (user) user(d); };
    doc.autoTable(Object.assign({}, TBL, { startY: y }, o)); y = doc.lastAutoTable.finalY + 9; };
  const execRow = (lbl, s) => [pt(lbl), pe(s.p), ps(s.rin - s.rout), pe(s.d), pe(s.eng), pe(s.rest), tauxS(s)];
  const execHead = [['', 'Prévu initial', 'Reports nets', 'Disponible', 'Engagé', 'Reste', 'Taux']];
  const execCols = { 1: num6, 2: num6, 3: num6, 4: num6, 5: num6, 6: num6 };
  const negRed = d => { if (d.section === 'body' && d.column.index === 5 && /^-/.test(String(d.cell.raw))) d.cell.styles.textColor = RED; };

  /* Page de titre (en-tête du rapport) */
  const lw = 34, tx = M + lw + 8;
  doc.addImage(LOGO, 'JPEG', M, 8, lw, lw * LOGO_R);
  doc.setTextColor(...HEAD); doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.text(pt('Rapport financier'), tx, 18);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(100, 100, 110); doc.text(pt(CFG.titre + '  ·  ' + perim), tx, 26);
  doc.setDrawColor(...HEAD); doc.setLineWidth(0.8); doc.line(M, 34, W - M, 34);
  y = 45;

  if (rub.cles) {
    title('Chiffres clés');
    const boxes = [['Prévu initial', pe(a.p)], ['Reports nets', ps(a.rin - a.rout)], ['Disponible', pe(a.d)], ['Engagé', pe(a.eng)], ['Reste à consommer', pe(a.rest)], ["Taux d'exécution", tauxS(a)]];
    const g = 4, bw = (W - 2 * M - g * 5) / 6;
    boxes.forEach(([l, v], i) => { const x = M + i * (bw + g);
      doc.setFillColor(244, 246, 248); doc.roundedRect(x, y, bw, 20, 2, 2, 'F');
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(110, 110, 120); doc.text(pt(l), x + 4, y + 7);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(...(i === 4 && a.rest < 0 ? RED : [30, 30, 40])); doc.text(pt(v), x + 4, y + 15.5); });
    y += 26;
    const t = Math.min(100, tauxN(a) || 0);
    doc.setFillColor(225, 232, 240); doc.roundedRect(M, y, W - 2 * M, 4, 2, 2, 'F');
    if (t > 0) { doc.setFillColor(...ACC); doc.roundedRect(M, y, (W - 2 * M) * t / 100, 4, 2, 2, 'F'); }
    doc.setFontSize(8); doc.setTextColor(110, 110, 120); doc.setFont('helvetica', 'normal');
    doc.text(pt(`Exécution : ${tauxS(a)} du budget disponible engagé`), M, y + 9); y += 18;
  }

  if (rub.section) {
    title('Exécution par section');
    const secs = [...new Set(k.sel.map(x => String(x.r[B.section] || 'Non renseignée')))].sort();
    table({ head: execHead, body: secs.map(s => execRow(s, agg(k.sel.filter(x => String(x.r[B.section] || 'Non renseignée') === s)))),
      foot: [execRow('Total', a)], columnStyles: Object.assign({ 0: { cellWidth: 60 } }, execCols), didParseCell: negRed });
  }

  if (rub.axe) {
    title('Exécution par axe et référence budgétaire');
    const body = [], axes = [...new Set(k.sel.map(x => disp(B.table, B.axe, x.r[B.axe]) || 'Sans axe'))].sort();
    axes.forEach(ax => { const xs = k.sel.filter(x => (disp(B.table, B.axe, x.r[B.axe]) || 'Sans axe') === ax);
      body.push({ axe: true, row: execRow(ax, agg(xs)) });
      [...new Set(xs.map(x => String(x.r[B.ref] || '-')))].sort().forEach(rf => body.push({ row: execRow('    ' + rf, agg(xs.filter(x => String(x.r[B.ref] || '-') === rf))) })); });
    table({ head: execHead, body: body.map(b => b.row), foot: [execRow('Total', a)], columnStyles: Object.assign({ 0: { cellWidth: 60 } }, execCols),
      didParseCell: d => { negRed(d); if (d.section === 'body' && body[d.row.index].axe) { d.cell.styles.fontStyle = 'bold'; d.cell.styles.fillColor = [244, 246, 248]; } } });
  }

  if (rub.pluri) {
    title('Évolution pluriannuelle');
    const ys = [...new Set(k.all.map(x => yearOf(x.r)))].filter(Boolean).sort();
    const row = (l, s) => [pt(l), pe(s.p), s.rin ? '+' + pe(s.rin) : '-', s.rout ? '-' + pe(s.rout) : '-', pe(s.d), pe(s.eng), pe(s.rest), tauxS(s)];
    table({ head: [['Année', 'Prévu initial', 'Reports reçus', 'Reports cédés', 'Disponible', 'Engagé', 'Reste', 'Taux']],
      body: ys.map(yy => row(yy, agg(k.all.filter(x => yearOf(x.r) === yy)))), foot: [row('Total', agg(k.all))],
      columnStyles: { 0: { cellWidth: 30 }, 1: num6, 2: num6, 3: num6, 4: num6, 5: num6, 6: num6, 7: num6 },
      didParseCell: d => { if (d.section === 'body' && d.cell.raw === S.rp.yr) d.row.cells && Object.values(d.row.cells).forEach(c => c.styles.fontStyle = 'bold'); } });
  }

  if (rub.alertes) {
    title("Points d'attention");
    const cur = String(new Date().getFullYear()), rows = [];
    k.sel.filter(x => x.rest < -0.5).forEach(x => rows.push(['Dépassement', pt(lineLabel(x.r)), pe(x.d), pe(x.eng), pe(x.rest), tauxS(x)]));
    k.sel.filter(x => x.d > 0 && yearOf(x.r) >= cur && (tauxN(x) || 0) < S.rp.seuil).forEach(x => rows.push([`Sous-consommation (< ${S.rp.seuil} %)`, pt(lineLabel(x.r)), pe(x.d), pe(x.eng), pe(x.rest), tauxS(x)]));
    k.sel.filter(x => yearOf(x.r) < cur && x.rest > 0.5).forEach(x => rows.push(['Reste sur exercice clos (à reporter)', pt(lineLabel(x.r)), pe(x.d), pe(x.eng), pe(x.rest), tauxS(x)]));
    if (!rows.length) { doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(80); doc.text(pt('Aucun point d\'attention à la date d\'arrêté.'), M, y + 3); y += 12; }
    else table({ head: [['Alerte', 'Ligne', 'Disponible', 'Engagé', 'Reste', 'Taux']], body: rows,
      columnStyles: { 0: { cellWidth: 55, fontStyle: 'bold' }, 2: num6, 3: num6, 4: num6, 5: num6 },
      didParseCell: d => { if (d.section === 'body' && d.column.index === 0) d.cell.styles.textColor = /^D/.test(d.cell.raw) ? RED : AMB; } });
  }

  if (rub.cmd) {
    title('Commandes de la période');
    if (!k.cmds.length) { doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(80); doc.text(pt('Aucune commande.'), M, y + 3); y += 12; }
    else {
      table({ head: [['Date', 'N° commande', 'Prestataire', 'Ligne imputée', "Type d'achat", 'Montant']],
        body: k.cmds.map(c => [fmtDate(c[C.date]), pt(c[C.num]), pt(disp(C.table, C.presta, c[C.presta])), pt(lineLabel(L(c[C.ligne]))), pt(c[C.type]), pe(c[C.montant])]),
        foot: [['', '', '', '', 'Total', pe(k.cmds.reduce((s, c) => s + num(c[C.montant]), 0))]],
        columnStyles: { 0: { cellWidth: 22 }, 1: { cellWidth: 30 }, 2: { cellWidth: 45 }, 4: { cellWidth: 34 }, 5: Object.assign({ cellWidth: 28 }, num6) } });
      const types = {}; k.cmds.forEach(c => { const t = String(c[C.type] || 'Non renseigné'); types[t] = types[t] || [0, 0]; types[t][0]++; types[t][1] += num(c[C.montant]); });
      const tot = k.cmds.reduce((s, c) => s + num(c[C.montant]), 0);
      y -= 3; doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(...HEAD); doc.text(pt("Répartition par type d'achat"), M, y); y += 2;
      table({ head: [["Type d'achat", 'Nb', 'Montant', 'Part']], body: Object.entries(types).sort((p, q) => q[1][1] - p[1][1]).map(([t, [n, m]]) => [pt(t), n, pe(m), tot ? Math.round(m / tot * 100) + ' %' : '-']),
        tableWidth: 140, columnStyles: { 1: num6, 2: num6, 3: num6 } });
    }
  }

  if (rub.rep) {
    title('Journal des reports');
    if (!k.reps.length) { doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(80); doc.text(pt('Aucun report sur la période.'), M, y + 3); y += 12; }
    else table({ head: [['Date', 'Ligne source', 'Ligne cible', 'Montant', 'Motif', 'Auteur']],
      body: k.reps.map(x => [fmtDate(x[R.date]), pt(L(x[R.source]) ? lineLabel(L(x[R.source])) : '?'), pt(L(x[R.cible]) ? lineLabel(L(x[R.cible])) : '?'), pe(x[R.montant]), pt(x[R.motif]), pt(x[R.auteur])]),
      columnStyles: { 0: { cellWidth: 22 }, 3: Object.assign({ cellWidth: 26 }, num6), 5: { cellWidth: 30 } } });
  }

  if (rub.annexe) {
    doc.addPage(); y = 24; title('Annexe : détail des lignes budgétaires');
    const xs = k.sel.slice().sort((p, q) => yearOf(p.r).localeCompare(yearOf(q.r)) || lineLabel(p.r).localeCompare(lineLabel(q.r)));
    table({ head: [['Année', 'Ligne', 'Section', 'Prévu', 'Reports nets', 'Disponible', 'Engagé', 'Reste', 'Taux']],
      body: xs.map(x => [yearOf(x.r), pt([disp(B.table, B.axe, x.r[B.axe]), x.r[B.ref], x.r[B.com]].filter(Boolean).join(' · ')), pt(x.r[B.section]), pe(x.p), ps(x.rin - x.rout), pe(x.d), pe(x.eng), pe(x.rest), tauxS(x)]),
      foot: [['', 'Total', '', pe(a.p), ps(a.rin - a.rout), pe(a.d), pe(a.eng), pe(a.rest), tauxS(a)]],
      columnStyles: { 0: { cellWidth: 15 }, 2: { cellWidth: 28 }, 3: num6, 4: num6, 5: num6, 6: num6, 7: num6, 8: num6 },
      didParseCell: d => { if (d.section === 'body' && d.column.index === 7 && /^-/.test(String(d.cell.raw))) d.cell.styles.textColor = RED; } });
  }

  /* En-têtes et pieds de page */
  const n = doc.getNumberOfPages(), ed = new Date().toLocaleDateString('fr-FR');
  for (let i = 1; i <= n; i++) {
    doc.setPage(i);
    if (i > 1) { doc.addImage(LOGO, 'JPEG', M, 4.5, 14, 14 * LOGO_R);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...HEAD); doc.text(pt('Rapport financier · ' + CFG.titre), M + 17, 11.5);
      doc.setFont('helvetica', 'normal'); doc.setTextColor(120); doc.text(pt(perim), W - M, 11.5, { align: 'right' }); doc.setDrawColor(220); doc.setLineWidth(0.2); doc.line(M, 15, W - M, 15); }
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(140);
    doc.text(pt('Édité le ' + ed), M, 203); doc.text(`${i} / ${n}`, W - M, 203, { align: 'right' });
  }
  doc.save(`Rapport_financier_${S.rp.yr || 'pluriannuel'}_${S.rp.arr || 'date'}.pdf`);
  toast('PDF généré');
}

/* ---------- Démarrage ---------- */
let tmr; const reload = () => { clearTimeout(tmr); tmr = setTimeout(load, 400); };
grist.ready({ requiredAccess: 'full' });
grist.onRecords(reload);
load();
</script>
</body>
